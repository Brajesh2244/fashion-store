<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | FashionStore</title>
    <link rel="stylesheet" href="assets/css/style.css?v=4">
    <link rel="stylesheet" href="assets/css/profile.css?v=4">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<!-- NAVBAR -->
<header class="header-wrapper">
    <nav class="navbar">
        <div class="logo">
            <a href="index.html">
                <span class="logo-icon"><i class="fa-solid fa-bag-shopping"></i></span>
                <span class="logo-text">Fashion<span class="logo-accent">Store</span></span>
            </a>
        </div>
        <ul class="nav-links" id="navLinks">
            <li><a href="index.html" class="nav-link"><i class="fa-solid fa-house"></i> Home</a></li>
            <li><a href="products.html" class="nav-link"><i class="fa-solid fa-shirt"></i> Products</a></li>
            <li><a href="cart.html" class="nav-link cart-link"><i class="fa-solid fa-cart-shopping"></i> Cart</a></li>
            <li><a href="orders.html" class="nav-link"><i class="fa-solid fa-box-archive"></i> Orders</a></li>
            <li class="user-pill-item">
                <a href="profile.html" class="user-pill active" title="My Profile">
                    <span class="user-avatar"><i class="fa-solid fa-user"></i></span>
                    <span class="user-name">Brajesh</span>
                </a>
            </li>
            <li class="theme-toggle-item">
                <button id="themeToggleBtn" class="theme-toggle-btn" type="button" aria-label="Toggle Dark Mode" title="Toggle Dark/Light Mode">
                    <span class="toggle-track">
                        <i class="fa-solid fa-sun icon-sun"></i>
                        <i class="fa-solid fa-moon icon-moon"></i>
                        <span class="toggle-thumb"></span>
                    </span>
                </button>
            </li>
        </ul>
    </nav>
</header>

<div class="container">
    <h1 class="page-title">Account Settings</h1>

    <div class="profile-card">
        <div class="profile-header">
            <div class="profile-avatar-circle">
                <i class="fa-solid fa-user"></i>
            </div>
            <h3 id="profNameHeading">Brajesh Sharma</h3>
            <p id="profEmailHeading"><i class="fa-regular fa-envelope"></i> brajesh@fashionstore.com</p>
        </div>

        <form onsubmit="handleSaveProfile(event)">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="profName" required>
            </div>

            <div class="profile-grid-row">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="profEmail" readonly style="opacity:0.8; cursor:not-allowed;">
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="text" id="profPhone" required>
                </div>
            </div>

            <div class="form-group">
                <label>Default Street Address</label>
                <input type="text" id="profAddress" placeholder="Flat, House no., Building, Street">
            </div>

            <div class="profile-grid-row">
                <div class="form-group">
                    <label>City</label>
                    <input type="text" id="profCity" placeholder="City">
                </div>
                <div class="form-group">
                    <label>State</label>
                    <input type="text" id="profState" placeholder="State">
                </div>
            </div>

            <div class="form-group">
                <label>PIN Code</label>
                <input type="text" id="profPin" placeholder="6-digit PIN code">
            </div>

            <button type="submit" class="save-profile-btn">
                <i class="fa-solid fa-floppy-disk"></i> Update Profile Details
            </button>
        </form>
    </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    const user = App.getUser();
    document.getElementById('profNameHeading').textContent = user.fullName;
    document.getElementById('profEmailHeading').innerHTML = `<i class="fa-regular fa-envelope"></i> ${user.email}`;

    document.getElementById('profName').value = user.fullName || '';
    document.getElementById('profEmail').value = user.email || '';
    document.getElementById('profPhone').value = user.phone || '';
    document.getElementById('profAddress').value = user.address || '';
    document.getElementById('profCity').value = user.city || '';
    document.getElementById('profState').value = user.state || '';
    document.getElementById('profPin').value = user.pincode || '';
});

function handleSaveProfile(e) {
    e.preventDefault();
    const updated = {
        fullName: document.getElementById('profName').value.trim(),
        email: document.getElementById('profEmail').value.trim(),
        phone: document.getElementById('profPhone').value.trim(),
        address: document.getElementById('profAddress').value.trim(),
        city: document.getElementById('profCity').value.trim(),
        state: document.getElementById('profState').value.trim(),
        pincode: document.getElementById('profPin').value.trim()
    };
    App.saveUser(updated);
    document.getElementById('profNameHeading').textContent = updated.fullName;
}
</script>

</body>
</html>
